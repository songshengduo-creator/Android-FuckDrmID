name: Build NDK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build with ndk-build
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk APP_CPPFLAGS="-fpermissive -Wno-pointer-sign-convert -Qunused-arguments"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-libs
          path: libs/
